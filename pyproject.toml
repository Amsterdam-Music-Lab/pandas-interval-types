[project]
name = "pandas-interval-types"
version = "0.0.1"
license = "GPL-3.0-or-later"
authors = [
  { name="Christoph Finkensiep", email="c.finkensiep@uva.nl" }
]
description = "Left-closed intervals over arbitrary time types (int, float, Fraction, ...)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "pandas-fractions",
    "pytest>=9.1.1",
]

[tool.uv.sources]
pandas-fractions = { git = "https://github.com/Amsterdam-Music-Lab/pandas-fractions" }

[[tool.mypy.overrides]]
# pandas has no inline types, and the array module uses pandas internals
module = ["pandas.*"]
ignore_missing_imports = true
